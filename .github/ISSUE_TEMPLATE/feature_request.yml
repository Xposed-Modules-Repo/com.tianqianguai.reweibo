name: 功能建议 / Feature Request
description: 提出新功能、体验改进或兼容性建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请说明需求背景和希望达到的效果。

        Thank you for your suggestion. Please describe the need and desired outcome.

  - type: dropdown
    id: target_app
    attributes:
      label: 相关应用 / Related App
      options:
        - 微博轻享版 / Weibo Lite
        - 新浪微博 / Weibo
        - Share
        - ReWeibo 通用功能 / General
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 需求背景 / Motivation
      description: 当前遇到了什么不便或限制？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed Solution
      description: 希望 ReWeibo 如何工作？可附示例或界面草图。
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: 对现有功能的影响 / Impact on Existing Behavior
      description: 请说明建议是否会改变现有配置、操作方式或兼容性；没有影响可填写“无”。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
      description: 如果考虑过其他实现方式，可以在这里补充。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Pre-submission Checklist
      options:
        - label: 我已搜索现有 Issues，确认没有相同建议。 / I searched existing issues and found no duplicate request.
          required: true
        - label: 我已说明该建议对现有功能和配置的影响。 / I described the impact on existing behavior and configuration.
          required: true
